<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password — Body Tone Fitness</title>
<link rel="stylesheet" href="style.css">
<style>
.reset-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
.reset-card{width:min(520px,100%);padding:32px;border:1px solid rgba(255,255,255,.12);border-radius:20px;background:rgba(15,15,15,.9)}
.reset-card h1{margin:0 0 8px}.reset-card p{opacity:.75;line-height:1.5}
.reset-card label{display:block;margin:18px 0 7px}.reset-card input{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:#111;color:#fff}
.reset-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.reset-actions button{cursor:pointer}
#otpStep,#passwordStep{display:none}.status{min-height:22px;margin-top:14px}
</style>
<style id="btf-motion-css">
/* BTF motion layer */
:root{--motion-red:#e01622}
body{overflow-x:hidden}
@media (prefers-reduced-motion:no-preference){
  .nav{animation:navDrop .7s cubic-bezier(.2,.8,.2,1) both}
  .hero>*{animation:heroIn .9s cubic-bezier(.2,.8,.2,1) both}
  .hero h1{animation-delay:.08s}.hero p{animation-delay:.16s}.hero .actions{animation-delay:.24s}
  .card,.person,.page-photo-split,.stats,.gallery-item,.testimonial-card{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1),border-color .3s ease,box-shadow .3s ease}
  .btf-reveal.is-visible{opacity:1;transform:none}
  .card:hover,.person:hover{transform:translateY(-8px);border-color:rgba(224,22,34,.65);box-shadow:0 18px 50px rgba(0,0,0,.35)}
  .person img{transition:transform .8s cubic-bezier(.2,.8,.2,1)}
  .person:hover img{transform:scale(1.035)}
  .btn{transition:transform .25s ease,box-shadow .25s ease,filter .25s ease}.btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(181,17,26,.22);filter:brightness(1.08)}
  .brand .logo{animation:logoFloat 4s ease-in-out infinite}
  .goldline{animation:linePulse 2.4s ease-in-out infinite}
}
@keyframes navDrop{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}
@keyframes heroIn{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes logoFloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(1deg)}}
@keyframes linePulse{0%,100%{transform:scaleX(1);opacity:.7}50%{transform:scaleX(1.45);opacity:1}}
.btf-page-noise{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.035;background-image:radial-gradient(#fff .5px,transparent .5px);background-size:5px 5px;mix-blend-mode:screen}
/* Trainer cinematic section */
.trainer-stage{position:relative;overflow:hidden;padding:95px 0;background:#050505;border-top:1px solid #242424;border-bottom:1px solid #242424}
.trainer-stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.25;filter:contrast(1.08) saturate(.75);pointer-events:none}
.trainer-stage:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,5,5,.96),rgba(5,5,5,.68),rgba(5,5,5,.9));pointer-events:none}
.trainer-stage .container{position:relative;z-index:2}
.trainer-stage h2{font-size:clamp(48px,7vw,92px);line-height:.9;letter-spacing:-3px;margin:0 0 18px;max-width:820px}.trainer-stage h2 span{color:var(--motion-red)}
.trainer-stage p{max-width:640px;color:#b8b8b8;line-height:1.8}
.trainer-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}
.person{padding:0;overflow:hidden;background:linear-gradient(145deg,#121212,#090909);border-radius:16px}
.person img{display:block;width:100%;height:520px;object-fit:cover;object-position:center top;border-radius:0;filter:none}
.person .trainer-copy{padding:26px 28px 30px}.person h3{font-size:28px;margin:0 0 8px}.person h3 strong{font-weight:900;color:#fff}.person .special{color:var(--motion-red);letter-spacing:1px}.person p{color:#a8a8a8;font-size:13px;line-height:1.8;margin-top:10px}
.trainer-bg-badge{display:inline-flex;padding:7px 11px;border:1px solid rgba(224,22,34,.5);color:#fff;font-size:9px;font-weight:900;letter-spacing:2px;margin-bottom:18px;background:rgba(224,22,34,.08)}
@media(max-width:900px){.trainer-grid{grid-template-columns:1fr}.person img{height:560px}}
@media(max-width:560px){.person img{height:460px}.trainer-stage{padding:72px 0}.trainer-stage h2{letter-spacing:-2px}}
</style></head>
<body>
<div class="reset-wrap">
  <div class="reset-card">
    <p class="eyebrow">ACCOUNT SECURITY</p>
    <h1>Reset your password</h1>
    <p id="intro">Enter the email address linked to your Body Tone Fitness account. We'll send a verification OTP to that email.</p>

    <div id="emailStep">
      <label for="resetEmail">Email address</label>
      <input id="resetEmail" type="email" autocomplete="email" placeholder="you@example.com" required>
      <div class="reset-actions">
        <button id="sendOtp" class="button" type="button">Send OTP</button>
      </div>
    </div>

    <div id="otpStep">
      <label for="otp">Verification OTP</label>
      <input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="Enter the OTP">
      <div class="reset-actions">
        <button id="verifyOtp" class="button" type="button">Verify OTP</button>
        <button id="resendOtp" class="secondary" type="button">Resend OTP</button>
      </div>
    </div>

    <div id="passwordStep">
      <label for="newPassword">New password</label>
      <input id="newPassword" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters">
      <label for="confirmPassword">Confirm new password</label>
      <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" placeholder="Enter it again">
      <div class="reset-actions">
        <button id="savePassword" class="button" type="button">Set new password</button>
      </div>
    </div>

    <p id="status" class="status" aria-live="polite"></p>
  </div>
</div>

<script src="./config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/*
  Supabase project settings are expected to be defined in the same way as
  the rest of the Body Tone Fitness site.
*/
const SUPABASE_URL = window.BTF_CONFIG?.supabaseUrl || "";
const SUPABASE_ANON_KEY = window.BTF_CONFIG?.supabaseAnonKey || "";
let sb = null;
let resetEmail = "";

function setStatus(msg){ document.getElementById("status").textContent=msg; }

function getClient(){
  if(sb) return sb;
  if(!SUPABASE_URL || !SUPABASE_ANON_KEY){
    setStatus("Supabase configuration is missing.");
    return null;
  }
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  return sb;
}

async function sendOtp(){
  const email=document.getElementById("resetEmail").value.trim().toLowerCase();
  if(!email){setStatus("Enter your account email.");return;}
  const client=getClient(); if(!client)return;
  resetEmail=email;
  setStatus("Sending OTP…");

  /*
    Supabase sends a one-time code when email OTP is enabled. The email is
    never exposed on the page beyond the value the user entered.
  */
  const {error}=await client.auth.signInWithOtp({
    email,
    options:{shouldCreateUser:false}
  });
  if(error){setStatus(error.message);return;}

  document.getElementById("emailStep").style.display="none";
  document.getElementById("otpStep").style.display="block";
  setStatus("OTP sent. Check your email.");
}

async function verifyOtp(){
  const token=document.getElementById("otp").value.trim();
  if(!token){setStatus("Enter the OTP from your email.");return;}
  const client=getClient(); if(!client)return;
  setStatus("Verifying OTP…");

  const {error}=await client.auth.verifyOtp({
    email:resetEmail,
    token,
    type:"email"
  });
  if(error){setStatus("Invalid or expired OTP.");return;}

  document.getElementById("otpStep").style.display="none";
  document.getElementById("passwordStep").style.display="block";
  setStatus("Email verified. Choose a new password.");
}

async function savePassword(){
  const p=document.getElementById("newPassword").value;
  const c=document.getElementById("confirmPassword").value;
  if(p.length<8){setStatus("Use a password with at least 8 characters.");return;}
  if(p!==c){setStatus("The passwords do not match.");return;}
  const client=getClient(); if(!client)return;
  setStatus("Updating password…");

  const {error}=await client.auth.updateUser({password:p});
  if(error){setStatus(error.message);return;}

  setStatus("Password updated successfully. You can now sign in with your new password.");
  document.getElementById("passwordStep").innerHTML =
    '<p><strong>Password updated.</strong></p><a class="button" href="index.html">Back to Body Tone Fitness</a>';
}

document.getElementById("sendOtp").onclick=sendOtp;
document.getElementById("resendOtp").onclick=sendOtp;
document.getElementById("verifyOtp").onclick=verifyOtp;
document.getElementById("savePassword").onclick=savePassword;
</script>

<script id="btf-motion-script">
(function(){
 const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 const targets=document.querySelectorAll('.card,.person,.page-photo-split,.stats,.gallery-item,.testimonial-card');
 targets.forEach(el=>el.classList.add('btf-reveal'));
 if(reduce){targets.forEach(el=>el.classList.add('is-visible'));return;}
 const io=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('is-visible');io.unobserve(e.target)}}),{threshold:.08,rootMargin:'0px 0px -35px 0px'});
 targets.forEach(el=>io.observe(el));
 document.querySelectorAll('.trainer-stage video').forEach(v=>{v.muted=true;v.playsInline=true;const p=v.play();if(p&&p.catch)p.catch(()=>{});});
})();
</script>
</body>
</html>
